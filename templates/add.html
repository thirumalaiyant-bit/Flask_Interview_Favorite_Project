
<!DOCTYPE html>
<html>
<head>
    <title>Add Favorite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4 mx-auto" style="max-width: 500px;">
        <h2 class="text-center mb-4">Add Interview Favorite</h2>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" name="name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Favorite</label>
                <input type="text" name="favorite" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Add Favorite
            </button>

        </form>

        <a href="/" class="btn btn-secondary w-100 mt-2">
            Back
        </a>
    </div>
</div>

</body>
</html>
